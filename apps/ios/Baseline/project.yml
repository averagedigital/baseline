name: Baseline
options:
  bundleIdPrefix: org.averagedigital
  deploymentTarget:
    iOS: "17.0"
packages:
  BaselinePackages:
    path: ../../../packages/swift
targets:
  Baseline:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: BaselinePackages
        product: AthleteCore
      - package: BaselinePackages
        product: AthleteAgents
      - package: BaselinePackages
        product: AthleteStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.averagedigital.baseline
        PRODUCT_NAME: Baseline
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Baseline
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  BaselineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Baseline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.averagedigital.baseline.tests
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Baseline:
    build:
      targets:
        Baseline: all
        BaselineTests: [test]
    test:
      targets:
        - BaselineTests
