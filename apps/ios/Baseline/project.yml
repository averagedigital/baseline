name: Baseline
options:
  bundleIdPrefix: org.averagedigital
  deploymentTarget:
    iOS: "17.0"
packages:
  BaselinePackages:
    path: ../../../packages/swift
targets:
  Baseline:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Sources
      - path: Resources
        optional: true
        buildPhase: resources
    dependencies:
      - package: BaselinePackages
        product: AthleteCore
      - package: BaselinePackages
        product: AthleteSensors
      - package: BaselinePackages
        product: AthleteStore
      - package: BaselinePackages
        product: AthleteNutrition
      - package: BaselinePackages
        product: AthletePersonalization
      - package: BaselinePackages
        product: AthleteIntelligence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.averagedigital.baseline
        PRODUCT_NAME: Baseline
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Baseline
        INFOPLIST_KEY_NSCameraUsageDescription: Камера используется для анализа позы и локального food-gate. Видео не записывается.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  BaselineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Baseline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.averagedigital.baseline.tests
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Baseline:
    build:
      targets:
        Baseline: all
        BaselineTests: [test]
    test:
      targets:
        - BaselineTests
