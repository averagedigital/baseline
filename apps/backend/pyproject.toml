[project]
name = "baseline-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.48,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=12,<13",
  "numpy>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
